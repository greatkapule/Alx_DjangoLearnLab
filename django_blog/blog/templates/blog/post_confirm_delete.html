{% extends "blog/base.html" %}

{% block content %}
    <div style="background: white; padding: 30px; border-radius: 8px; text-align: center;">
        <form method="POST">
            {% csrf_token %}
            <h2>Are you sure?</h2>
            <p>You are about to delete the post: <strong>"{{ object.title }}"</strong>. This action cannot be undone.</p>
            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'post-detail' object.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
