{% extends "blog/base.html" %}

{% block content %}
<h2>{{ post.title }}</h2>
<p>{{ post.content }}</p>
<p>By {{ post.author }}</p>

{% if user == post.author %}
    <a href="{% url 'blog:post-update' post.pk %}">Edit</a> |
    <a href="{% url 'blog:post-delete' post.pk %}">Delete</a>
{% endif %}
{% endblock %}
