{% extends "blog/base.html" %}

{% block content %}
    <div style="background: white; padding: 30px; border-radius: 8px; max-width: 800px; margin: 0 auto;">
        <h2>{% if form.instance.pk %}Update Post{% else %}New Post{% endif %}</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn">Save Post</button>
            <a href="{% url 'post-list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
