{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    <header>
        <h1>My Awesome Django Blog</h1>
        <nav>
            {% if user.is_authenticated %}
                <form action="{% url 'blog:logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:#000;cursor:pointer;padding:0;">Logout</button>
                </form>
                |
                <a href="{% url 'blog:profile' %}">Profile</a>
            {% else %}
                <a href="{% url 'blog:login' %}">Login</a> |
                <a href="{% url 'blog:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
